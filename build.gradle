plugins {
    // 1.16.1 ships obfuscated, so this uses the remapping Loom plugin with Mojang's official names.
    id 'net.fabricmc.fabric-loom-remap' version '1.18.3'
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings(loom.officialMojangMappings())
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

processResources {
    def props = [
            version              : version,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

java {
    // Compiled with JDK 21 targeting Java 8; the game itself runs on Java 8 or newer.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}
